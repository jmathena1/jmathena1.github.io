<!doctype html>
<html lang="en-US">
  <head>
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/literata/literata-latin.woff2"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
      charset="utf-8"
    />
    <title>Johnny Dot Com</title>

    <link rel="stylesheet" href="/css/index.css" />
    <link rel="icon" type="image/png" href="/photos/john-favicon.png" />
    <script type="text/javascript" src="/js/header.js"></script>
    <script type="text/javascript" src="/js/footer.js"></script>
  </head>

  <body class="grid-wrapper">
    <custom-header></custom-header>
    <br />
    <section class="post-content">
      <a href="/{posts_directory_name}">
        <h1>{content_title}</h1>
      </a>
      <br />
      <h2>{title}</h2>
      <p>{date}</p>
      {content}
    </section>
    <br />

    <custom-footer></custom-footer>
  </body>
</html>
