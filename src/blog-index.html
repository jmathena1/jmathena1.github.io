<!doctype html>
<html lang="en-US">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
      charset="utf-8"
    />
    <title>Johnny Dot Com</title>

    <link rel="stylesheet" href="/css/index.css" />
    <link rel="icon" type="image/png" href="/photos/john-favicon.png" />
    <link
      rel="alternate"
      type="application/atom+xml"
      href="/{posts_directory_name}/atom.xml"
      title="{content_title}"
    />
    <script type="text/javascript" src="/js/header.js"></script>
    <script type="text/javascript" src="/js/footer.js"></script>
  </head>

  <body class="grid-wrapper">
    <custom-header></custom-header>

    <main class="main">
      <section class="strays-header">
        <h1>{content_title}</h1>
        <h2>{content_description}</h2>
        <p>
          <a href="/{posts_directory_name}/atom.xml"
            >[ Subscribe via Atom feed ]</a
          >
        </p>
      </section>
      <section class="posts-list">{posts}</section>
    </main>

    <custom-footer></custom-footer>
  </body>
</html>
